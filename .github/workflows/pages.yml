name: Deploy site (wiki + game) to GitHub Pages

# 一次发布整站，覆盖三个路径：
#   /        根导航页（tools/pages/index.html）
#   /wiki/   游戏内容 wiki（data/** → data.json → 静态 HTML）
#   /game/   Godot Web 导出
#
# 每次触发都全量重建 wiki + game，不缓存 /game 产物，最省心。
# 触发方式：
#   - push main 且命中 paths（游戏源码 / 数据 / 美术 / wiki 工具等）
#   - Actions 页手动 Run workflow
#   - push v* tag（见 pages-release.yml，复用本文件）
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scenes/**"
      - "assets/**"
      - "data/**"
      - "addons/**"
      - "project.godot"
      - "export_presets.cfg"
      - "icon.svg"
      - "tools/build_web.sh"
      - "tools/build_wiki.py"
      - "tools/build_wiki.sh"
      - "tools/wiki/**"
      - "tools/wiki_dump.gd"
      - "tools/wiki_dump.tscn"
      - "tools/pages/**"
      - ".github/workflows/pages.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 不是超时问题（134 是 SIGABRT），但导出确实偏慢，放宽上限兜底。
      GODOT_TIMEOUT: "1800"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装 Python 依赖
        run: pip install --quiet pillow

      # Godot 既用于导出 .tres → data.json，也用于 Web 导出。
      - name: 安装 Godot 4.7.2
        run: |
          curl -fsSL -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      # 只缓存导出模板（几百 MB），不是缓存的 /game 产物。
      - name: 缓存 Web 导出模板
        id: tpl
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-templates-4.7.2-stable

      - name: 安装 Web 导出模板
        if: steps.tpl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p /tmp/tpl ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q templates.tpz -d /tmp/tpl
          cp -a /tmp/tpl/templates/. ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: 刷新 Godot 导入缓存
        run: ./godot --headless --path . --import

      - name: 构建 wiki（输出到站点的 /wiki）
        run: ./tools/build_wiki.sh --out .tmp/site/wiki --data .tmp/wiki/data.json

      - name: 导出 Web 游戏（输出到站点的 /game）
        run: ./tools/build_web.sh .tmp/site/game

      - name: 组装站点（根导航页 + .nojekyll）
        run: |
          cp tools/pages/index.html .tmp/site/index.html
          touch .tmp/site/.nojekyll
          find .tmp/site -maxdepth 2 -type f | sort

      # 首发布前需到 Settings → Pages 把 Source 选成 GitHub Actions（一次性）。
      # 不在这用 enablement: true：该选项要求 PAT / GitHub App 这类
      # 非 GITHUB_TOKEN 凭证，用默认 token 会报 Resource not accessible。
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .tmp/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
